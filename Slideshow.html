<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- page title -->
    <title>Slideshow</title>
    <!-- link to the css file -->
    <link rel="stylesheet" href="main.css">
    <menu>
        <ul>
            <!-- Link to the homepage -->
            <li><a href="Homepage.html">Home</a></li>
            <!-- Link to the slideshow page -->
            <li><a href="Slideshow.html">Slideshow</a></li>
        </ul>
    </menu>
</head>
<body>
    <!-- Div for the main slideshow page -->
    <div class = "Page_Container">
        <!-- Div for each slide card -->
        <div class = "Card">
            <!-- title of the slideshow -->
            <h1>CC0 Image Slideshow</h1>
            <!-- div for each image -->
            <div class = "Image">
                <!-- image for the slideshow -->
                <img id = "Slideshow_Image" src = "" alt = "Old Drawing Slideshow Image">
            </div>
            <!-- div for the next and previous buttons -->
            <div class = "Button">
                <!-- previous button -->
                <button id = "Previous_Button">Previous</button>
                <!-- Next button -->
                <button id = "Next_Button">Next</button>
            </div>

        </div>
    </div>
    <!-- link to the javascript file that controls the slideshow -->
    <script src="main.js"></script>
</body>
</html>
