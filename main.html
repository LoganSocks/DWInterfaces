<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title of the page -->
    <title>Student Profile</title>
    <!-- link to the css file -->
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="profile-card">
        <h1>Student Information</h1>
        <!-- div for name -->
        <div class="info-row">
            <!-- Strong will bold the text -->
            <strong>Name:</strong> 
            <!-- This will come from javascript -->
            <span id="student-name"></span>
        </div>
        <!-- div for major -->
        <div class="info-row">
            <!-- Strong will bold the text -->
            <strong>Major:</strong> 
            <!-- This will come for javascript -->
            <span id="student-major"></span>
        </div>
        <!-- div for email -->
        <div class="info-row">
            <!-- Strong will bold the text -->
            <strong>UAT Email:</strong> 
            <!-- This will come from javascript -->
            <span id="student-email"></span>
        </div>
        <!-- div for graduation date -->
        <div class="info-row">
            <!-- Strong will bold the text -->
            <strong>Expected Graduation Date:</strong> 
            <!-- This will come from javascript -->
            <span id="student-grad-date"></span>
        </div>
    </div>

    <!-- shortcut tp the javascript-->
    <script src="main.js"></script>
</body>
</html>
